<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tests - Condominio Eucaliptus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #1a1a2e; color: #e5e7eb; padding: 2rem; }
    h1 { color: #fff; margin-bottom: 1rem; }
    .test { padding: 0.4rem 0; border-bottom: 1px solid #374151; }
    .pass { color: #10b981; }
    .fail { color: #ef4444; }
    .summary { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-size: 1.1rem; }
    .summary.all-pass { background: #065f46; color: #d1fae5; }
    .summary.has-fail { background: #991b1b; color: #fee2e2; }
  </style>
</head>
<body>
  <h1>Tests</h1>
  <div id="results"></div>
  <div id="summary" class="summary"></div>

  <script src="js/utils.js"></script>
  <script src="js/audit.js"></script>

  <script>
    var results = document.getElementById('results');
    var passed = 0, failed = 0;

    function assert(name, got, expected) {
      var ok = got === expected;
      if (ok) passed++; else failed++;
      var div = document.createElement('div');
      div.className = 'test ' + (ok ? 'pass' : 'fail');
      div.textContent = (ok ? '✓' : '✗') + ' ' + name + (ok ? '' : ' — got ' + JSON.stringify(got) + ', expected ' + JSON.stringify(expected));
      results.appendChild(div);
    }

    function assertClose(name, got, expected, tolerance) {
      var ok = Math.abs(got - expected) <= tolerance;
      if (ok) passed++; else failed++;
      var div = document.createElement('div');
      div.className = 'test ' + (ok ? 'pass' : 'fail');
      div.textContent = (ok ? '✓' : '✗') + ' ' + name + (ok ? '' : ' — got ' + JSON.stringify(got) + ', expected ~' + JSON.stringify(expected));
      results.appendChild(div);
    }

    function assertThrows(name, fn) {
      try { fn(); failed++; var div = document.createElement('div'); div.className = 'test fail'; div.textContent = '✗ ' + name + ' — expected error, none thrown'; results.appendChild(div); }
      catch (e) { passed++; var div = document.createElement('div'); div.className = 'test pass'; div.textContent = '✓ ' + name + ' — threw: ' + e.message; results.appendChild(div); }
    }

    // Globals que leen las funciones de utils
    var PAGOS = [];
    var CONFIG = {};
    var GASTOS = [];

    // ── formatMoney ──
    assert('formatMoney(0)', formatMoney(0), '0');
    assert('formatMoney(100)', formatMoney(100), '100');
    assert('formatMoney(1000)', formatMoney(1000), '1.000');
    assert('formatMoney(1234567)', formatMoney(1234567), '1.234.567');
    assert('formatMoney(999)', formatMoney(999), '999');
    assert('formatMoney(1000000)', formatMoney(1000000), '1.000.000');
    assert('formatMoney(1500)', formatMoney(1500), '1.500');
    assert('formatMoney(1234567890)', formatMoney(1234567890), '1.234.567.890');
    assert('formatMoney(1500.4)', formatMoney(1500.4), '1.500');
    assert('formatMoney(1500.5)', formatMoney(1500.5), '1.501');

    // ── formatPeriodo ──
    assert('formatPeriodo("2025-07")', formatPeriodo('2025-07'), '07/2025');
    assert('formatPeriodo("2025-12")', formatPeriodo('2025-12'), '12/2025');
    assert('formatPeriodo("2025-01")', formatPeriodo('2025-01'), '01/2025');
    assert('formatPeriodo(null)', formatPeriodo(null), '');
    assert('formatPeriodo("")', formatPeriodo(''), '');
    assert('formatPeriodo("2025-07-15")', formatPeriodo('2025-07-15'), '07/2025');
    assert('formatPeriodo("abc")', formatPeriodo('abc'), 'abc');

    // ── formatDate ──
    assert('formatDate("2025-07-15")', formatDate('2025-07-15'), '15/07/2025');
    assert('formatDate("2025-12-01")', formatDate('2025-12-01'), '01/12/2025');
    assert('formatDate("2025-01-05T12:00:00")', formatDate('2025-01-05T12:00:00'), '05/01/2025');
    assert('formatDate(null)', formatDate(null), '');
    assert('formatDate("")', formatDate(''), '');
    assert('formatDate("15/07/2025")', formatDate('15/07/2025'), '15/07/2025');

    // ── escHtml / nl2br ──
    assert('escHtml("<b>")', escHtml('<b>'), '&lt;b&gt;');
    assert('escHtml("a&b")', escHtml('a&b'), 'a&amp;b');
    assert('escHtml(\'"\')', escHtml('"'), '&quot;');
    assert('escHtml("\'")', escHtml("'"), '&#39;');
    assert('escHtml(null)', escHtml(null), '');
    assert('escHtml("")', escHtml(''), '');
    assert('nl2br escapa y convierte \\n', nl2br('<b>x</b>\nlinea'), '&lt;b&gt;x&lt;/b&gt;<br>linea');
    assert('nl2br(null)', nl2br(null), '');

    // ── safeUrl ──
    assert('safeUrl("https://x")', safeUrl('https://x'), 'https://x');
    assert('safeUrl("http://x")', safeUrl('http://x'), 'http://x');
    assert('safeUrl("/ruta")', safeUrl('/ruta'), '/ruta');
    assert('safeUrl("../docs/x.pdf")', safeUrl('../docs/x.pdf'), '../docs/x.pdf');
    assert('safeUrl("assets/demo_x.png")', safeUrl('assets/demo_x.png'), 'assets/demo_x.png');
    assert('safeUrl("blob:https://app/uuid")', safeUrl('blob:https://app/uuid'), 'blob:https://app/uuid');
    assert('safeUrl("data:image/png;base64,x")', safeUrl('data:image/png;base64,x'), 'data:image/png;base64,x');
    assert('safeUrl("javascript:alert(1)")', safeUrl('javascript:alert(1)'), '');
    assert('safeUrl("JaVaScRiPt:alert(1)")', safeUrl('JaVaScRiPt:alert(1)'), '');
    assert('safeUrl("java\\nscript:alert(1)")', safeUrl('java\nscript:alert(1)'), '');
    assert('safeUrl("vbscript:x")', safeUrl('vbscript:x'), '');
    assert('safeUrl("file:///etc/passwd")', safeUrl('file:///etc/passwd'), '');
    assert('safeUrl("data:text/html,x")', safeUrl('data:text/html,x'), '');
    assert('safeUrl("  javascript:alert(1)  ")', safeUrl('  javascript:alert(1)  '), '');
    assert('safeUrl(null)', safeUrl(null), '');
    assert('safeUrl("")', safeUrl(''), '');

    // ── Deudores / estado de pago ──
    var TG = [
      { id: '1', periodo: '2026-07', monto: '100', parcela_id: 'A', pagado: 'Sí' },
      { id: '2', periodo: '2026-07', monto: '100', parcela_id: 'B', pagado: 'No' },
      { id: '3', periodo: '2026-06', monto: '50', parcela_id: 'A', pagado: 'Sí' },
      { id: '4', periodo: '2026-07', monto: '200', parcela_id: 'C', pagado: 'No' }
    ];
    var TP = [{ id: 'A', numero: 'Parcela 1' }, { id: 'B', numero: 'Parcela 2' }, { id: 'C', numero: 'Parcela 3' }];

    assert('isPagado sí', isPagado({ pagado: 'Sí' }), true);
    assert('isPagado no', isPagado({ pagado: 'No' }), false);
    assert('isPagado null', isPagado(null), false);
    assert('isPagado sin campo', isPagado({ monto: '100' }), false);

    assert('esperadoPorPeriodo 2026-07', esperadoPorPeriodo('2026-07', TG), 400);
    assert('esperadoPorPeriodo 2026-06', esperadoPorPeriodo('2026-06', TG), 50);
    assert('esperadoPorPeriodo 2025-01', esperadoPorPeriodo('2025-01', TG), 0);
    assert('esperadoPorPeriodo sin datos', esperadoPorPeriodo('2026-07', []), 0);

    assert('recaudadoPorPeriodo 2026-07', recaudadoPorPeriodo('2026-07', TG), 100);

    assert('pctRecaudado 2026-07', pctRecaudado('2026-07', TG), 25);
    assert('pctRecaudado sin esperado', pctRecaudado('2025-01', TG), 0);

    assert('deudaParcela A (al día)', deudaParcela('A', TG), 0);
    assert('deudaParcela B', deudaParcela('B', TG), 100);
    assert('deudaParcela sin deuda', deudaParcela('ZZZ', TG), 0);

    assert('estadoParcelaPago A', estadoParcelaPago('A', TG), 'Al día');
    assert('estadoParcelaPago B', estadoParcelaPago('B', TG), 'Deudor');

    assert('periodosPendientes B', periodosPendientes('B', TG).join(','), '2026-07');
    assert('periodosPendientes A (al día)', periodosPendientes('A', TG).length, 0);
    assert('periodosPendientes sin registros', periodosPendientes('ZZZ', TG).length, 0);

    assert('deudaPorPeriodo B', JSON.stringify(deudaPorPeriodo('B', TG)), JSON.stringify([{ periodo: '2026-07', monto: 100 }]));
    assert('deudaPorPeriodo A (al día)', deudaPorPeriodo('A', TG).length, 0);
    var TS = [{ id: '9', parcela_id: 'B', monto: '30', pagado: 'No' }];
    assert('deudaPorPeriodo sin periodo', JSON.stringify(deudaPorPeriodo('B', TS)), JSON.stringify([{ periodo: '', monto: 30 }]));
    assert('deudaPorPeriodo ordena periodos', JSON.stringify(deudaPorPeriodo('B', [{ id: 'a', parcela_id: 'B', monto: '10', pagado: 'No', periodo: '2026-08' }, { id: 'b', parcela_id: 'B', monto: '20', pagado: 'No', periodo: '2026-06' }])), JSON.stringify([{ periodo: '2026-06', monto: 20 }, { periodo: '2026-08', monto: 10 }]));

    var mor = morosos(TG, TP);
    assert('morosos length', mor.length, 2);
    assert('morosos orden (por número de parcela)', mor[0].parcela_id, 'B');
    assert('morosos orden 2', mor[1].parcela_id, 'C');
    assert('morosos numero resuelto', mor[0].numero, 'Parcela 2');
    assert('morosos deuda', mor[0].deuda, 100);
    assert('morosos excluye al día', mor.some(function(m) { return m.parcela_id === 'A'; }), false);
    assert('morosos sin datos', morosos([], TP).length, 0);
    assert('morosos sin parcelas', morosos(TG, []).length, 2);

    var morNat = morosos([
      { id: '5', parcela_id: 'B', monto: '100', pagado: 'No' },
      { id: '6', parcela_id: 'Z', monto: '50', pagado: 'No' }
    ], [{ id: 'B', numero: 'Parcela 10' }, { id: 'Z', numero: 'Parcela 2' }]);
    assert('morosos orden natural (Parcela 2 antes que Parcela 10)', morNat[0].parcela_id, 'Z');

    // ── Pagos (nuevo modelo) ──
    var TPG = [
      { id: 'g1', periodo: '2026-07', monto: '100', parcela_id: 'A' },
      { id: 'g2', periodo: '2026-07', monto: '100', parcela_id: 'B' },
      { id: 'g3', periodo: '2026-06', monto: '50', parcela_id: 'B' }
    ];
    var TPP = [
      { id: 'p1', gasto_id: 'g1', parcela_id: 'A', periodo: '2026-07', monto: '40' },
      { id: 'p2', gasto_id: 'g1', parcela_id: 'A', periodo: '2026-07', monto: '60' },
      { id: 'p3', gasto_id: 'g2', parcela_id: 'B', periodo: '2026-07', monto: '30' }
    ];
    PAGOS = TPP;

    assert('getPagos devuelve PAGOS', getPagos().length, 3);
    assert('pagosDeGasto g1 (2 pagos)', pagosDeGasto('g1').length, 2);
    assert('pagosDeGasto inexistente', pagosDeGasto('zzz').length, 0);
    assert('sumPagosGasto g1 (40+60)', sumPagosGasto('g1'), 100);
    assert('sumPagosGasto g3 (sin pagos)', sumPagosGasto('g3'), 0);
    assert('pagosDeParcela A', pagosDeParcela('A').length, 2);

    assert('pagoLegado con pagos registrados es false', pagoLegado({ id: 'g1', pagado: 'Sí' }), false);
    assert('pagoLegado sin pagos es true', pagoLegado({ id: 'g3', pagado: 'Sí' }), true);

    assert('isPagado por pagos completos (g1)', isPagado({ id: 'g1', monto: '100' }), true);
    assert('isPagado por pagos parciales (g2)', isPagado({ id: 'g2', monto: '100' }), false);
    assert('isPagado por pagos parciales exacto (30 de 30)', isPagado({ id: 'g2', monto: '30' }), true);

    assert('recaudadoGasto g1 (completo)', recaudadoGasto({ id: 'g1', monto: '100' }), 100);
    assert('recaudadoGasto g2 (parcial)', recaudadoGasto({ id: 'g2', monto: '100' }), 30);
    assert('recaudadoGasto no supera monto', recaudadoGasto({ id: 'g1', monto: '50' }), 50);

    assert('deudaParcela A (cuota pagada con pagos)', deudaParcela('A', TPG), 0);
    assert('deudaParcela B (parcial)', deudaParcela('B', TPG), 120);
    assert('estadoParcelaPago B (parcial) es Deudor', estadoParcelaPago('B', TPG), 'Deudor');

    assert('deudaPorPeriodo B desglosa por periodo', JSON.stringify(deudaPorPeriodo('B', TPG)), JSON.stringify([{ periodo: '2026-06', monto: 50 }, { periodo: '2026-07', monto: 70 }]));
    assert('periodosPendientes B', periodosPendientes('B', TPG).join(','), '2026-06,2026-07');

    // Saldo a favor: pago mayor a la cuota absorbe deudas de otros periodos
    PAGOS = [{ id: 'p4', gasto_id: 'g4', parcela_id: 'A', periodo: '2026-07', monto: '150' }];
    assert('deudaParcela con saldo a favor', deudaParcela('A', [
      { id: 'g4', periodo: '2026-07', monto: '100', parcela_id: 'A' },
      { id: 'g5', periodo: '2026-06', monto: '100', parcela_id: 'A' }
    ]), 50);
    assert('deudaPorPeriodo absorbe excedente en recientes', JSON.stringify(deudaPorPeriodo('A', [
      { id: 'g4', periodo: '2026-07', monto: '100', parcela_id: 'A' },
      { id: 'g5', periodo: '2026-06', monto: '100', parcela_id: 'A' }
    ])), JSON.stringify([{ periodo: '2026-06', monto: 50 }]));

    // ── Config de periodos / cuota del periodo ──
    CONFIG = {
      montos: { gasto_comun_base: '100', fondo_reserva: '20' },
      periodos: [
        { periodo: '2026-07', monto: '120', fondo_reserva: '30' },
        { periodo: '2026-08', monto: '150', fondo_reserva: '30' }
      ]
    };
    assert('configPeriodos length', configPeriodos().length, 2);
    assert('periodoConfig 2026-07 existe', !!periodoConfig('2026-07'), true);
    assert('periodoConfig sin config es null', periodoConfig('2026-09'), null);
    assert('montosBase', JSON.stringify(montosBase()), JSON.stringify({ monto: 100, fondo_reserva: 20 }));
    assert('cuotaDelPeriodo con config', JSON.stringify(cuotaDelPeriodo('2026-07')), JSON.stringify({ monto: 120, fondo_reserva: 30, total: 150 }));
    assert('cuotaDelPeriodo fallback a base', JSON.stringify(cuotaDelPeriodo('2026-09')), JSON.stringify({ monto: 100, fondo_reserva: 20, total: 120 }));
    assert('cuotaDelPeriodo fondo reserva no configurado en periodo', cuotaDelPeriodo('2026-08').total, 180);

    CONFIG = { montos: { gasto_comun_base: '100', fondo_reserva: '20' } };
    assert('cuotaDelPeriodo sin periodos usa base', cuotaDelPeriodo('2026-07').total, 120);

    // ── siguientePeriodo / aviso de aumento ──
    CONFIG = {
      montos: { gasto_comun_base: '100', fondo_reserva: '20' },
      periodos: [
        { periodo: '2026-07', monto: '120', fondo_reserva: '30' },
        { periodo: '2026-08', monto: '150', fondo_reserva: '30' }
      ]
    };
    GASTOS = [
      { id: 'x', periodo: '2026-07', monto: '100', parcela_id: 'A', pagado: 'Sí' },
      { id: 'y', periodo: '2026-07', monto: '100', parcela_id: 'B', pagado: 'No' }
    ];
    assert('siguientePeriodo tras 2026-07', siguientePeriodo(), '2026-08');
    var aviso = avisoAumento();
    assert('avisoAumento periodo', aviso.periodo, '2026-08');
    assert('avisoAumento anterior', aviso.anterior, 150);
    assert('avisoAumento nuevo', aviso.nuevo, 180);
    assert('avisoAumento pct', aviso.pct, 20);

    CONFIG = { montos: { gasto_comun_base: '100', fondo_reserva: '20' }, periodos: [{ periodo: '2026-07', monto: '120', fondo_reserva: '30' }] };
    GASTOS = [{ id: 'x', periodo: '2026-07', monto: '100', parcela_id: 'A', pagado: 'Sí' }];
    assert('avisoAumento sin aumento es null', avisoAumento(), null);
    GASTOS = [];
    assert('avisoAumento sin cuotas es null', avisoAumento(), null);

    // Restablecer globals
    PAGOS = [];
    CONFIG = {};
    GASTOS = [];

    // ── Finanzas / Balance ──
    assert('mesDeFecha dd/mm/yyyy', mesDeFecha('15/07/2025'), '2025-07');
    assert('mesDeFecha d/mm/yyyy (día de 1 dígito)', mesDeFecha('2/08/2024'), '2024-08');
    assert('mesDeFecha yyyy-mm-dd', mesDeFecha('2025-07-15'), '2025-07');
    assert('mesDeFecha iso con hora', mesDeFecha('2025-07-15T12:00:00'), '2025-07');
    assert('mesDeFecha vacío', mesDeFecha(''), '');
    assert('mesDeFecha null', mesDeFecha(null), '');
    assert('mesDeFecha sin mes válido', mesDeFecha('2025'), '');

    var TF = [
      { id: 'f1', tipo: 'Ingreso', concepto: 'Multa', fecha: '12/07/2026', monto: '30' },
      { id: 'f2', tipo: 'Egreso', concepto: 'Electricidad', fecha: '5/07/2026', monto: '40' },
      { id: 'f3', tipo: 'Egreso', concepto: 'Agua', fecha: '02/08/2026', monto: '60' },
      { id: 'f4', tipo: 'Ingreso', concepto: 'Multa', fecha: '2026-07-03', monto: '20' }
    ];

    assert('ingresosDerivados 2026-07', ingresosDerivados('2026-07', TG), 100);
    assert('ingresosDerivados sin datos', ingresosDerivados('2026-07', []), 0);

    assert('egresosMes 2026-07', egresosMes('2026-07', TF), 40);
    assert('egresosMes 2026-08', egresosMes('2026-08', TF), 60);
    assert('egresosMes sin egresos', egresosMes('2026-09', TF), 0);
    assert('egresosMes sin datos', egresosMes('2026-07', []), 0);

    assert('ingresosMes 2026-07 (cuotas + manuales)', ingresosMes('2026-07', TG, TF), 150);
    assert('ingresosMes 2026-06', ingresosMes('2026-06', TG, TF), 50);
    assert('ingresosMes 2026-08', ingresosMes('2026-08', TG, TF), 0);
    assert('ingresosMes sin datos', ingresosMes('2026-07', [], []), 0);

    assert('periodosFinanzas union cuotas+movimientos', JSON.stringify(periodosFinanzas(TG, TF)), JSON.stringify(['2026-08', '2026-07', '2026-06']));
    assert('periodosFinanzas sin datos', periodosFinanzas([], []).length, 0);
    assert('saldoPeriodo 2026-07 (ingresos 150 - egresos 40)', saldoPeriodo('2026-07', TG, TF), 110);
    assert('saldoPeriodo sin datos', saldoPeriodo('2026-07', [], []), 0);

    // ── Publicaciones de venta ──
    var TPUB = [
      { id: 'p1', categoria: 'Producto', estado: 'Disponible' },
      { id: 'p2', categoria: 'Servicio', estado: 'Vendido' },
      { id: 'p3', categoria: 'Producto', estado: 'Vendido' },
      { id: 'p4', categoria: 'Servicio', estado: 'Disponible' }
    ];
    assert('filtrarPublicaciones todas/todos', filtrarPublicaciones(TPUB, 'todas', 'todos').length, 4);
    assert('filtrarPublicaciones Producto/todos', filtrarPublicaciones(TPUB, 'Producto', 'todos').length, 2);
    assert('filtrarPublicaciones todas/Disponible', filtrarPublicaciones(TPUB, 'todas', 'Disponible').length, 2);
    assert('filtrarPublicaciones Servicio/Vendido', filtrarPublicaciones(TPUB, 'Servicio', 'Vendido').length, 1);
    assert('filtrarPublicaciones sin resultados', filtrarPublicaciones(TPUB, 'Producto', 'Vendido')[0].id, 'p3');
    assert('filtrarPublicaciones lista vacía', filtrarPublicaciones([], 'todas', 'todos').length, 0);
    assert('filtrarPublicaciones null', filtrarPublicaciones(null, 'todas', 'todos').length, 0);

    // ── sanitizeAudit ──
    var sa = sanitizeAudit({ nombre: 'A', rut: '1-9', email: 'a@b.cl' });
    assert('sanitizeAudit oculta rut', sa.rut, '[oculto]');
    assert('sanitizeAudit oculta email', sa.email, '[oculto]');
    assert('sanitizeAudit mantiene nombre', sa.nombre, 'A');
    assert('sanitizeAudit no muta original', sa === null ? true : JSON.stringify(sa) !== JSON.stringify({ nombre: 'A', rut: '1-9', email: 'a@b.cl' }), true);
    assert('sanitizeAudit oculta telefono', sanitizeAudit({ telefono: '9 1234' }).telefono, '[oculto]');
    assert('sanitizeAudit registro vacío', JSON.stringify(sanitizeAudit({})), '{}');

    // Summary
    var summary = document.getElementById('summary');
    var total = passed + failed;
    summary.textContent = passed + '/' + total + ' tests passed' + (failed > 0 ? ' (' + failed + ' failed)' : '');
    summary.className = 'summary ' + (failed === 0 ? 'all-pass' : 'has-fail');
  </script>
</body>
</html>
